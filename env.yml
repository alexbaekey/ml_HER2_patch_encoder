name: ml_her2
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # Core
  - python=3.10
  - pip
  - numpy
  - pandas
  - scikit-learn
  - tqdm
  - pillow
  - h5py

  # PyTorch + CUDA (RTX 4080)
  - pytorch=2.2.*
  - torchvision=0.17.*
  - pytorch-cuda=12.1

  # OpenSlide (system + python bindings)
  - openslide
  - openslide-python

  # Useful utils
  - matplotlib
  - opencv

  # timm + extras via pip (better version coverage)
  - pip:
      - timm
      - einops
      - scikit-image
      - albumentations
prefix: ~/miniconda3/envs/ml_her2
